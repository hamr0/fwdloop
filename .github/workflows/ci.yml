# Tests on every PR and every push to main. Publishing stays in publish.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: read

concurrency:                # a newer push to a PR supersedes its older run; pushes to main each keep their own result
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Upgrade npm (same major publish.yml uses)
        run: npm install -g npm@11
      - name: Install dependencies
        run: npm ci
      - name: Lockfile version matches package.json
        run: npm run check:lockfile --if-present
      - name: Typecheck
        run: npm run typecheck --if-present
      - name: Install ripgrep (litectx impact needs rg)
        run: sudo apt-get update && sudo apt-get install -y ripgrep fonts-symbola fonts-freefont-ttf
      - name: Warm up chromium (the first start on a fresh runner is slow; browser tests allow 10 s per start)
        run: |
          for i in 1 2; do
            s=$(date +%s%N)
            timeout 120 /usr/bin/chromium-browser --headless=new --no-sandbox --disable-gpu --dump-dom about:blank > /dev/null 2>&1 || echo "chromium start $i exited non-zero"
            echo "chromium start $i: $(( ($(date +%s%N) - s) / 1000000 )) ms"
          done
      - name: Test
        run: npm test --if-present
