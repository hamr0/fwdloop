# Tests on every PR and every push to main. Publishing stays in publish.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: read

concurrency:                # a newer push to a PR supersedes its older run; pushes to main each keep their own result
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Upgrade npm (same major publish.yml uses)
        run: npm install -g npm@11
      - name: Install dependencies
        run: npm ci
      - name: Lockfile version matches package.json
        run: npm run check:lockfile --if-present
      - name: Typecheck
        run: npm run typecheck --if-present
      - name: Test
        run: npm test --if-present
